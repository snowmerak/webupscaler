<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Upscaler v2</title>
  </head>
  <body>
    <main class="popup">
      <header class="hero">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation">
            <path d="M5 6.5 8.1 18l3.9-8 3.9 8L19 6.5" />
          </svg>
        </span>
        <div class="title-group">
          <p id="site-label" class="eyebrow">VIDEO · WEBGPU</p>
          <h1>Web Upscaler <span>v2</span></h1>
        </div>
        <span id="state-badge" class="state-badge">꺼짐</span>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <div>
          <strong id="status-title">상태 확인 중</strong>
          <p id="status-message">지원되는 영상 플레이어와 연결하고 있습니다.</p>
        </div>
      </section>

      <section class="control-card">
        <label class="toggle-row" for="enabled">
          <span>
            <strong>현재 사이트에서 사용</strong>
            <small>영상 플레이어 위에 처리 결과를 표시합니다.</small>
          </span>
          <span class="switch">
            <input id="enabled" type="checkbox" />
            <span aria-hidden="true"></span>
          </span>
        </label>

        <div class="divider"></div>

        <label class="field" for="mode">
          <span>
            <strong>처리 모드</strong>
            <small>2× 복원에 유지할 시간축 관측량을 조절합니다.</small>
          </span>
          <select id="mode">
            <option value="auto">Auto</option>
            <option value="balanced">Balanced</option>
            <option value="eco">Eco</option>
          </select>
        </label>

        <label class="check-row" for="debug-overlay">
          <input id="debug-overlay" type="checkbox" />
          <span>영상 위에 성능 정보 표시</span>
        </label>
      </section>

      <section id="metrics" class="metrics" hidden>
        <div><span>Source</span><strong id="source-size">—</strong></div>
        <div><span>Output</span><strong id="output-size">—</strong></div>
        <div><span>GPU queue p90</span><strong id="frame-time">—</strong></div>
      </section>

      <footer>
        <span class="privacy-dot"></span>
        영상 데이터는 브라우저 밖으로 전송되지 않습니다.
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
